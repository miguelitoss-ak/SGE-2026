<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE-2026 - Sistema de Gestão de Estágios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-green-800 text-white flex flex-col">
            <div class="p-6 text-2xl font-bold border-b border-green-700">
                IFRS - SGE
            </div>
            <nav class="flex-grow p-4 space-y-2">
                <a href="index.html" class="block p-3 bg-green-700 rounded-lg shadow-sm"><i
                        class="fas fa-chart-line mr-2"></i> Dashboard</a>
                <a href="alunos.html" class="block p-3 hover:bg-green-700 rounded-lg transition"><i
                        class="fas fa-user-graduate mr-2"></i> Alunos</a>
                <a href="empresas.html" class="block p-3 hover:bg-green-700 rounded-lg transition"><i
                        class="fas fa-building mr-2"></i> Empresas</a>
                <a href="estagios.html" class="block p-3 hover:bg-green-700 rounded-lg transition"><i
                        class="fas fa-file-contract mr-2"></i> Estágios</a>
                <a href="orientadores.html" class="block p-3 hover:bg-green-700 rounded-lg transition"><i
                        class="fas fa-chalkboard-teacher mr-2"></i> Orientadores</a>
            </nav>
            <div class="p-4 border-t border-green-700">
                <button class="w-full text-left p-2 hover:text-red-300"><i class="fas fa-sign-out-alt mr-2"></i>
                    Sair</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-grow flex flex-col overflow-hidden">
            <header class="bg-white shadow-sm p-4 flex justify-between items-center px-8">
                <h1 class="text-xl font-semibold text-gray-700">Bem-vindo ao Sistema de Estágios</h1>
                <div class="flex items-center space-x-4">
                    <span class="text-gray-600">Admin IFRS</span>
                    <div class="w-10 h-10 bg-gray-300 rounded-full flex items-center justify-center">
                        <i class="fas fa-user text-gray-600"></i>
                    </div>
                </div>
            </header>

            <div class="p-8 overflow-y-auto">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-blue-500">
                        <h3 class="text-gray-500 text-sm font-medium">Estágios Ativos</h3>
                        <p class="text-3xl font-bold text-gray-800">42</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-green-500">
                        <h3 class="text-gray-500 text-sm font-medium">Empresas Conveniadas</h3>
                        <p class="text-3xl font-bold text-gray-800">15</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-yellow-500">
                        <h3 class="text-gray-500 text-sm font-medium">Documentos Pendentes</h3>
                        <p class="text-3xl font-bold text-gray-800">08</p>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-md min-h-[400px]">
                    <h2 class="text-lg font-bold mb-4 text-gray-700">Atividade Recente</h2>
                    <p class="text-gray-500 italic text-sm">Carregando logs do sistema...</p>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
