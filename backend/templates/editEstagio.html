<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE-2026 | Editar Estágio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --ifrs-green: #32a041;
            --ifrs-green-dark: #267a32;
        }
        .bg-ifrs-green { background-color: var(--ifrs-green); }
        .text-ifrs-green { color: var(--ifrs-green); }
        .hover-bg-ifrs-green:hover { background-color: var(--ifrs-green-dark); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <!-- Header Superior -->
    <header class="bg-ifrs-green text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="home.html" class="bg-white p-2 rounded-lg hover:scale-105 transition-transform">
                    <i data-lucide="graduation-cap" class="text-ifrs-green w-8 h-8"></i>
                </a>
                <div>
                    <h1 class="text-xl font-bold leading-tight tracking-tight">SGE-2026</h1>
                    <p class="text-xs font-light opacity-90">Gestão de Estágios IFRS</p>
                </div>
            </div>
            <div class="flex items-center">
                <a href="home.html" class="flex items-center space-x-2 bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl transition-colors font-bold text-sm">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>VOLTAR</span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-10">
        <div class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
            <div class="bg-amber-500 p-8 text-white">
                <h2 class="text-2xl font-black flex items-center space-x-3">
                    <i data-lucide="edit" class="w-8 h-8"></i>
                    <span>EDITAR ESTÁGIO</span>
                </h2>
                <p class="text-amber-50 opacity-80 mt-2">Atualize as informações do vínculo de estágio selecionado.</p>
            </div>

            <form id="editForm" action="/estagios/update" method="POST" class="p-8 space-y-10">
                <input type="hidden" name="id" id="estagio_id" value="">
                
                <!-- Seção 1: Participantes -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-4">
                        <h3 class="font-bold text-gray-800 flex items-center text-sm uppercase tracking-wider text-amber-600">
                            <i data-lucide="users" class="w-4 h-4 mr-2"></i> Vínculos
                        </h3>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">ALUNO</label>
                            <div class="w-full bg-gray-100 border border-gray-200 rounded-xl px-4 py-3 text-gray-700 font-medium">
                                João da Silva (20240001) 
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Orientador IFRS</label>
                            <select name="id_orientador" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-amber-500 outline-none transition-all">
                                <option value="1" selected>Prof. Ricardo Rocha</option>
                                <option value="2">Profa. Helena Souza</option>
                            </select>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h3 class="font-bold text-gray-800 flex items-center text-sm uppercase tracking-wider text-amber-600">
                            <i data-lucide="building" class="w-4 h-4 mr-2"></i> Concedente
                        </h3>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Empresa</label>
                            <select name="id_empresa" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-amber-500 outline-none transition-all">
                                <option value="1" selected>Tech Inova S.A.</option>
                                <option value="2">Agile Sys LTDA</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Supervisor</label>
                            <select name="id_supervisor" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-amber-500 outline-none transition-all">
                                <option value="1" selected>Carlos Gerente</option>
                                <option value="2">Ana Líder</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Seção 2: Datas e Carga Horária -->
                <div class="space-y-4">
                    <h3 class="font-bold text-gray-800 flex items-center text-sm uppercase tracking-wider text-amber-600">
                        <i data-lucide="calendar" class="w-4 h-4 mr-2"></i> Período e Horas
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Data de Início</label>
                            <input type="date" name="data_inicio" value="2026-03-10" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-amber-500 outline-none transition-all">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Data de Término</label>
                            <input type="date" name="data_fim" value="2027-03-10" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-amber-500 outline-none transition-all">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Carga Horária Semanal (H)</label>
                            <input type="number" name="carga_horaria_semanal" value="20" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-amber-500 outline-none transition-all">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Situação</label>
                            <select name="situacao" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-amber-500 outline-none transition-all">
                                <option value="ATIVO" selected>Ativo</option>
                                <option value="PENDENTE">Pendente</option>
                                <option value="CONCLUIDO">Concluído</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Tipo de Estágio</label>
                            <select name="obrigatorio" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-amber-500 outline-none transition-all">
                                <option value="1" selected>Obrigatório</option>
                                <option value="0">Não Obrigatório</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Área de Atuação</label>
                            <input type="text" name="area" value="Desenvolvimento Backend" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-amber-500 outline-none transition-all">
                        </div>
                    </div>
                </div>

                <!-- Seção 3: Benefícios -->
                <div class="space-y-4">
                    <h3 class="font-bold text-gray-800 flex items-center text-sm uppercase tracking-wider text-amber-600">
                        <i data-lucide="dollar-sign" class="w-4 h-4 mr-2"></i> Bolsa e Benefícios
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">VALOR DA BOLSA (R$)</label>
                            <input type="number" step="0.01" name="bolsa_auxilio" value="1500.00" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-amber-500 outline-none transition-all">
                        </div>
                        <div class="md:col-span-2 flex items-center justify-around h-full pt-4">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" name="beneficio_transporte" checked class="w-5 h-5 rounded border-gray-300 text-amber-600 focus:ring-amber-500">
                                <span class="text-sm text-gray-600 font-medium">Transporte</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" name="beneficio_alimentacao" checked class="w-5 h-5 rounded border-gray-300 text-amber-600 focus:ring-amber-500">
                                <span class="text-sm text-gray-600 font-medium">Alimentação</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="pt-6 flex justify-end space-x-4 border-t border-gray-50">
                    <a href="home.html" class="px-8 py-4 text-gray-400 font-bold hover:text-gray-600 transition-colors uppercase tracking-widest text-xs flex items-center">Descartar Alterações</a>
                    <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-white px-10 py-4 rounded-2xl font-bold shadow-lg shadow-amber-100 transition-all transform hover:-translate-y-1 active:scale-95 flex items-center space-x-2">
                        <i data-lucide="save" class="w-5 h-5"></i>
                        <span>SALVAR ALTERAÇÕES</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();
        // Pequeno script para capturar o ID da URL e colocar no campo hidden
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if (id) document.getElementById('estagio_id').value = id;
    </script>
</body>
</html>
