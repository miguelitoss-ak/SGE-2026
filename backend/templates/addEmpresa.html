<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE-2026 | Cadastrar Empresa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --ifrs-green: #32a041;
            --ifrs-green-dark: #267a32;
        }
        .bg-ifrs-green { background-color: var(--ifrs-green); }
        .text-ifrs-green { color: var(--ifrs-green); }
        .hover-bg-ifrs-green:hover { background-color: var(--ifrs-green-dark); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <!-- Header Superior -->
    <header class="bg-ifrs-green text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="home.html" class="bg-white p-2 rounded-lg hover:scale-105 transition-transform">
                    <i data-lucide="graduation-cap" class="text-ifrs-green w-8 h-8"></i>
                </a>
                <div>
                    <h1 class="text-xl font-bold leading-tight tracking-tight">SGE-2026</h1>
                    <p class="text-xs font-light opacity-90">Gestão de Estágios IFRS</p>
                </div>
            </div>
            <div class="flex items-center">
                <a href="addEstagio.html" class="flex items-center space-x-2 bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl transition-colors font-bold text-sm">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>VOLTAR</span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-6 py-10">
        <div class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
            <div class="bg-ifrs-green p-8 text-white">
                <h2 class="text-2xl font-black flex items-center space-x-3">
                    <i data-lucide="building-2" class="w-8 h-8"></i>
                    <span>NOVA EMPRESA</span>
                </h2>
                <p class="text-green-50 opacity-80 mt-2">Cadastre uma nova empresa concedente de estágio.</p>
            </div>

            <!-- Seção de Escolha do Tipo de Cadastro -->
            <div class="p-8 bg-gray-50 border-b border-gray-100 text-center space-y-4">
                <p class="text-gray-700 font-semibold text-lg">Sua entidade tem:</p>
                <div class="flex justify-center space-x-4">
                    <button type="button" id="btnCnpj" class="flex items-center space-x-2 px-6 py-3 rounded-xl bg-ifrs-green text-white font-bold hover:bg-ifrs-green-dark transition-colors shadow-md">
                        <i data-lucide="building-2" class="w-5 h-5"></i>
                        <span>CNPJ</span>
                    </button>
                    <button type="button" id="btnIE" class="flex items-center space-x-2 px-6 py-3 rounded-xl bg-gray-200 text-gray-700 font-bold hover:bg-gray-300 transition-colors shadow-md">
                        <i data-lucide="tractor" class="w-5 h-5"></i>
                        <span>INSCRIÇÃO ESTADUAL</span>
                    </button>
                </div>
            </div>

            <form action="/empresas" method="POST" class="p-8 space-y-6" id="empresaForm">
                <input type="hidden" name="type_cadastro" id="type_cadastro" value="">
                
                <!-- CNPJ Form Fields -->
                <div id="cnpjFields" class="space-y-6 hidden">
                    <h3 class="font-bold text-gray-800 flex items-center text-sm uppercase tracking-wider mb-4">
                        <i data-lucide="building-2" class="w-4 h-4 mr-2 text-ifrs-green"></i> Dados da Empresa (CNPJ)
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="md:col-span-1">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">CNPJ</label>
                            <input type="text" name="CNPJ_NibocoProd" placeholder="00.000.000/0000-00" 
                                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                        </div>
                        <div class="md:col-span-1">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Inscrição Estadual (Opcional)</label>
                            <input type="text" name="inscricao_estadual" placeholder="Isento ou Número" 
                                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Razão Social</label>
                            <input type="text" name="nome_social" placeholder="Ex: Tecnologia Inovadora S.A." 
                                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Nome Fantasia</label>
                            <input type="text" name="nome_fantasia" placeholder="Ex: Tech Inova" 
                                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Nome do Representante Legal</label>
                            <input type="text" name="representante" placeholder="Nome completo do representante" 
                                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Cargo do Representante</label>
                            <input type="text" name="cargo" placeholder="Ex: Diretor de RH" 
                                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">E-mail Corporativo</label>
                            <div class="relative">
                                <i data-lucide="mail" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                                <input type="email" name="email" placeholder="rh@empresa.com" 
                                    class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Telefone Comercial</label>
                            <div class="relative">
                                <i data-lucide="phone" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                                <input type="text" name="telefone" id="telefoneCnpj" placeholder="(00) 0000-0000" maxlength="15"
                                    class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                            </div>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Endereço Sede</label>
                            <div class="relative">
                                <i data-lucide="map-pin" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                                <input type="text" name="endereco" placeholder="Rua, Número, Bairro, Cidade - UF" 
                                    class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- IE Form Fields (Produtor Rural) -->
                <div id="ieFields" class="space-y-6 hidden">
                    <h3 class="font-bold text-gray-800 flex items-center text-sm uppercase tracking-wider mb-4">
                        <i data-lucide="tractor" class="w-4 h-4 mr-2 text-ifrs-green"></i> Dados do Produtor Rural (Inscrição Estadual)
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Inscrição Estadual</label>
                            <input type="text" name="inscricao_estadual" placeholder="Número da Inscrição Estadual" 
                                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Nome do Produtor / Proprietário</label>
                            <input type="text" name="nome_social" placeholder="Ex: João da Silva" 
                                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Nome da Propriedade / Fazenda (Opcional)</label>
                            <input type="text" name="nome_fantasia" placeholder="Ex: Fazenda Esperança" 
                                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">E-mail de Contato</label>
                            <div class="relative">
                                <i data-lucide="mail" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                                <input type="email" name="email" placeholder="contato@produtor.com" 
                                    class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Telefone de Contato</label>
                            <div class="relative">
                                <i data-lucide="phone" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                                <input type="text" name="telefone" id="telefoneIe" placeholder="(00) 0000-0000" maxlength="15"
                                    class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                            </div>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Endereço da Propriedade</label>
                            <div class="relative">
                                <i data-lucide="map-pin" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                                <input type="text" name="endereco" placeholder="Rua, Número, Bairro, Cidade - UF" 
                                    class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pt-6 flex justify-end space-x-4 border-t border-gray-50 hidden" id="formActions">
                    <a href="addEstagio.html" class="px-8 py-4 text-gray-400 font-bold hover:text-gray-600 transition-colors uppercase tracking-widest text-xs flex items-center">
                        Cancelar
                    </a>
                    <button type="submit" class="bg-ifrs-green hover:bg-ifrs-green-dark text-white px-10 py-4 rounded-2xl font-bold shadow-lg shadow-green-100 transition-all transform hover:-translate-y-1 active:scale-95 flex items-center space-x-2">
                        <i data-lucide="save" class="w-5 h-5"></i>
                        <span>SALVAR</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const btnCnpj = document.getElementById('btnCnpj');
        const btnIE = document.getElementById('btnIE');
        const cnpjFields = document.getElementById('cnpjFields');
        const ieFields = document.getElementById('ieFields');
        const formActions = document.getElementById('formActions');
        const typeCadastro = document.getElementById('type_cadastro');
        const form = document.getElementById('empresaForm');

        function setRequired(element, isRequired) {
            if (element) { // Check if element exists
                if (isRequired) {
                    element.setAttribute('required', 'required');
                } else {
                    element.removeAttribute('required');
                }
            }
        }

        function toggleForm(type) {
            // Reset all fields and hide both forms
            cnpjFields.querySelectorAll('input').forEach(input => {
                input.value = '';
                setRequired(input, false);
            });
            ieFields.querySelectorAll('input').forEach(input => {
                input.value = '';
                setRequired(input, false);
            });
            cnpjFields.classList.add('hidden');
            ieFields.classList.add('hidden');
            formActions.classList.add('hidden');

            // Set type and show relevant form
            if (type === 'cnpj') {
                typeCadastro.value = 'cnpj';
                cnpjFields.classList.remove('hidden');
                formActions.classList.remove('hidden');
                // Set required fields for CNPJ
                setRequired(form.querySelector('input[name="CNPJ_NibocoProd"]'), true);
                setRequired(form.querySelector('#cnpjFields input[name="nome_social"]'), true);
                setRequired(form.querySelector('#cnpjFields input[name="nome_fantasia"]'), true);
                setRequired(form.querySelector('input[name="representante"]'), true);
                setRequired(form.querySelector('input[name="cargo"]'), true);
                setRequired(form.querySelector('#cnpjFields input[name="email"]'), true);
                setRequired(form.querySelector('#cnpjFields input[name="telefone"]'), true);
                setRequired(form.querySelector('#cnpjFields input[name="endereco"]'), true);
                
                // Update button styles
                btnCnpj.classList.add('bg-ifrs-green', 'text-white', 'hover:bg-ifrs-green-dark');
                btnCnpj.classList.remove('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                btnIE.classList.remove('bg-ifrs-green', 'text-white', 'hover:bg-ifrs-green-dark');
                btnIE.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');

            } else if (type === 'ie') {
                typeCadastro.value = 'ie';
                ieFields.classList.remove('hidden');
                formActions.classList.remove('hidden');
                // Set required fields for IE
                setRequired(form.querySelector('input[name="inscricao_estadual"]'), true);
                setRequired(form.querySelector('#ieFields input[name="nome_social"]'), true);
                setRequired(form.querySelector('#ieFields input[name="email"]'), true);
                setRequired(form.querySelector('#ieFields input[name="telefone"]'), true);
                setRequired(form.querySelector('#ieFields input[name="endereco"]'), true);

                // Update button styles
                btnIE.classList.add('bg-ifrs-green', 'text-white', 'hover:bg-ifrs-green-dark');
                btnIE.classList.remove('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                btnCnpj.classList.remove('bg-ifrs-green', 'text-white', 'hover:bg-ifrs-green-dark');
                btnCnpj.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
            }
        }

        btnCnpj.addEventListener('click', () => toggleForm('cnpj'));
        btnIE.addEventListener('click', () => toggleForm('ie'));

        // Seleção dos elementos para aplicação de máscaras de telefone
        const telefoneCnpjInput = document.getElementById('telefoneCnpj');
        const telefoneIeInput = document.getElementById('telefoneIe');

        // Máscara de Telefone ((00) 00000-0000)
        const applyTelefoneMask = (inputElement) => {
            if (inputElement) {
                inputElement.addEventListener('input', (e) => {
                    let v = e.target.value.replace(/\D/g, "");
                    if (v.length > 11) v = v.slice(0, 11);
                    v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
                    v = v.replace(/(\d{5})(\d)/, "$1-$2");
                    e.target.value = v;
                });
            }
        };

        applyTelefoneMask(telefoneCnpjInput);
        applyTelefoneMask(telefoneIeInput);

        // Função para remover máscaras antes de enviar
        function removeMasks() {
            if (telefoneCnpjInput) telefoneCnpjInput.value = telefoneCnpjInput.value.replace(/[^\d]+/g, '');
            if (telefoneIeInput) telefoneIeInput.value = telefoneIeInput.value.replace(/[^\d]+/g, '');
        }

        // Envia via fetch e volta para addEstagio.html ao concluir
        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            if (!typeCadastro.value) {
                alert('Selecione o tipo de cadastro antes de salvar.');
                return;
            }

            if (typeCadastro.value === 'cnpj') {
                ieFields.querySelectorAll('input').forEach(input => setRequired(input, false));
            } else if (typeCadastro.value === 'ie') {
                cnpjFields.querySelectorAll('input').forEach(input => setRequired(input, false));
            }

            removeMasks();

            const payload = Object.fromEntries(new FormData(form).entries());

            try {
                const response = await fetch('/empresas', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Empresa cadastrada com sucesso!');
                    window.location.href = 'addEstagio.html';
                    return;
                }

                alert(data.error || 'Erro ao salvar empresa.');
            } catch (error) {
                console.error('Erro ao salvar empresa:', error);
                alert('Falha na comunicação com o servidor.');
            }
        });
    </script>
</body>
</html>
