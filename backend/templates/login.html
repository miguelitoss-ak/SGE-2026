<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE-2026 | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --ifrs-green: #32a041;
            --ifrs-red: #e41f1a;
        }
        .bg-ifrs-green { background-color: var(--ifrs-green); }
        .text-ifrs-green { color: var(--ifrs-green); }
        .border-ifrs-green { border-color: var(--ifrs-green); }
        .focus-ifrs-green:focus { border-color: var(--ifrs-green); ring-color: var(--ifrs-green); }
    </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md border-t-8 border-ifrs-green">
        <div class="text-center mb-8">
            <!-- Logo Placeholder (Pode substituir pelo link oficial do logo do IFRS) -->
            <div class="flex justify-center mb-4">
            
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Sistema de Gestão de Estágios</h1>
            <br>
            <p class="text-gray-500 text-sm">Logar-se</p>
        </div>

        <form id="loginForm" action="/login" method="POST" class="space-y-6">
    <div>
        <label for="email" class="block text-sm font-medium text-gray-700">E-mail</label>
        <input type="email" id="email" name="email" required 
            class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400
            focus:outline-none focus:border-ifrs-green focus:ring-1 focus:ring-ifrs-green"
            placeholder="exemplo@ifrs.edu.br">
    </div>

    <div>
        <label for="senha" class="block text-sm font-medium text-gray-700">Senha</label>
        <input type="password" id="senha" name="senha" required 
            class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400
            focus:outline-none focus:border-ifrs-green focus:ring-1 focus:ring-ifrs-green"
            placeholder="••••••••">
    </div>

    <div class="flex items-center justify-between">
        <div class="flex items-center">
        
        </div>
        <div class="text-sm">
            <a href="forgot-password.html" class="font-medium text-ifrs-green hover:underline">
                Esqueceu a senha?
            </a>
        </div>
    </div>

    <div>
        <button type="submit" 
            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-ifrs-green hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-ifrs-green transition-colors duration-200">
            ENTRAR NO SISTEMA
        </button>
    </div>

    <div class="text-center text-sm">
        <span class="text-gray-600">Não tem uma conta?</span>
        <a href="cadastro.html" class="font-medium text-ifrs-green hover:underline ml-1">
            Cadastre-se agora
                </a>
            </div>
</form>
    </div>

</body>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault(); // Impede a página de recarregar e tentar ir para "/login"

        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;

        try {
            // Rota correta apontando para o seu backend Express sob o prefixo /auth
            const resposta = await fetch('http://localhost:3000/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, senha })
            });

            // CORRIGIDO: Agora usando 'resposta' corretamente
            const dados = await resposta.json(); 

            if (resposta.ok) {
                // Guarda o token gerado pelo seu UserService no navegador
                localStorage.setItem('token', dados.token); 
                
                if (dados.user && dados.user.role) {
                    localStorage.setItem('role', dados.user.role);
                }
                
                if (dados.user && dados.user.nome) {
                    localStorage.setItem('userName', dados.user.nome);
                }

                if (dados.user && dados.user.matricula) {
                    localStorage.setItem('userMatricula', dados.user.matricula);
                }

                if (dados.user && dados.user.id) {
                    localStorage.setItem('userId', dados.user.id);
                }

                alert(`Bem-vindo de volta!`);
                
                localStorage.setItem('token', dados.token); 
                localStorage.setItem('role', dados.user.role);
                localStorage.setItem('userName', dados.user.nome);       
                localStorage.setItem('userMatricula', dados.user.matricula); 
                localStorage.setItem('userId', dados.user.id); // 🔥 LINHA ESSENCIAL ADICIONADA
    
                 window.location.href = 'home.html';
            } else {
                // Exibe o erro do seu backend (ex: "Usuario nao encontrado" ou "Senha invalida")
                alert(dados.error || 'Erro ao realizar login.');
            }
        } catch (erro) {
            console.error('Erro na comunicação com o servidor:', erro);
            alert('Não foi possível conectar ao servidor. O backend está ligado?');
        }
    });
</script>
</html>
