<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE-2026 | Cadastrar Supervisor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --ifrs-green: #32a041;
            --ifrs-green-dark: #267a32;
        }
        .bg-ifrs-green { background-color: var(--ifrs-green); }
        .text-ifrs-green { color: var(--ifrs-green); }
        .hover-bg-ifrs-green:hover { background-color: var(--ifrs-green-dark); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <!-- Header Superior -->
    <header class="bg-ifrs-green text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="home.html" class="bg-white p-2 rounded-lg hover:scale-105 transition-transform">
                    <i data-lucide="graduation-cap" class="text-ifrs-green w-8 h-8"></i>
                </a>
                <div>
                    <h1 class="text-xl font-bold leading-tight tracking-tight">SGE-2026</h1>
                    <p class="text-xs font-light opacity-90">Gestão de Estágios IFRS</p>
                </div>
            </div>
            <div class="flex items-center">
                <a href="addEstagio.html" class="flex items-center space-x-2 bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl transition-colors font-bold text-sm">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>VOLTAR</span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-6 py-10">
        <div class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
            <div class="bg-ifrs-green p-8 text-white">
                <h2 class="text-2xl font-black flex items-center space-x-3">
                    <i data-lucide="user-check" class="w-8 h-8"></i>
                    <span>NOVO SUPERVISOR</span>
                </h2>
                <p class="text-green-50 opacity-80 mt-2">Cadastre o profissional da empresa que acompanhará o estagiário.</p>
            </div>

            <form action="/supervisores" method="POST" class="p-8 space-y-6">
                
                <div class="space-y-4">
                    <!-- Seleção de Empresa -->
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Empresa / Concedente</label>
                        <select name="id_empresa" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                            <option value="">Selecione a empresa vinculada</option>
                            <option value="1">Tech Inova S.A.</option>
                            <option value="2">Agile Sys LTDA</option>
                        </select>
                        <p class="text-[10px] text-gray-400 mt-1 italic">* Caso a empresa não esteja na lista, cadastre-a primeiro.</p>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Nome Completo</label>
                        <input type="text" name="nome" placeholder="Ex: Carlos Alberto Silva" required 
                            class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">CPF</label>
                            <input type="text" name="cpf" placeholder="000.000.000-00" required 
                                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Cargo / Função</label>
                            <input type="text" name="cargo" placeholder="Ex: Engenheiro de Software" 
                                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">E-mail de Contato</label>
                            <div class="relative">
                                <i data-lucide="mail" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                                <input type="email" name="email" placeholder="carlos@empresa.com" required 
                                    class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Telefone Comercial</label>
                            <div class="relative">
                                <i data-lucide="phone" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                                <input type="text" name="telefone" placeholder="(00) 00000-0000" 
                                    class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pt-6 flex justify-end space-x-4 border-t border-gray-50">
                    <a href="addEstagio.html" class="px-8 py-4 text-gray-400 font-bold hover:text-gray-600 transition-colors uppercase tracking-widest text-xs flex items-center">
                        Cancelar
                    </a>
                    <button type="submit" class="bg-ifrs-green hover:bg-ifrs-green-dark text-white px-10 py-4 rounded-2xl font-bold shadow-lg shadow-green-100 transition-all transform hover:-translate-y-1 active:scale-95 flex items-center space-x-2">
                        <i data-lucide="save" class="w-5 h-5"></i>
                        <span>SALVAR SUPERVISOR</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
