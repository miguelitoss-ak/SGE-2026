<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE-2026 | Recuperar Senha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --ifrs-green: #32a041;
            --ifrs-red: #e41f1a;
        }
        .bg-ifrs-green { background-color: var(--ifrs-green); }
        .text-ifrs-green { color: var(--ifrs-green); }
        .border-ifrs-green { border-color: var(--ifrs-green); }
    </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center font-sans px-4">

    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md border-t-8 border-ifrs-green transform transition-all">
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <div class="bg-green-50 p-4 rounded-full text-ifrs-green">
                    <i data-lucide="key-round" class="w-10 h-10"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Recuperar Senha</h1>
            <p class="text-gray-500 text-sm mt-2">
                Insira seu e-mail cadastrado e enviaremos as instruções para você criar uma nova senha.
            </p>
        </div>

        <form id="forgotPasswordForm" action="/auth/forgot-password" method="POST" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 uppercase tracking-wider text-xs">E-mail</label>
                <div class="relative mt-1">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="mail" class="h-5 w-5 text-gray-400"></i>
                    </div>
                    <input type="email" id="email" name="email" required 
                        class="block w-full pl-10 px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-sm shadow-sm placeholder-gray-400
                        focus:outline-none focus:border-ifrs-green focus:ring-1 focus:ring-ifrs-green transition-all"
                        placeholder="seu.email@aluno.ifrs.edu.br">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" 
                    class="w-full flex justify-center py-4 px-4 border border-transparent rounded-xl shadow-lg text-sm font-bold text-white bg-ifrs-green hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-ifrs-green transition-all transform active:scale-95 uppercase tracking-widest">
                    Enviar Instruções
                </button>
            </div>

            <div class="text-center pt-4">
                <a href="login.html" class="inline-flex items-center text-sm font-medium text-ifrs-green hover:text-green-700 transition-colors">
                    <i data-lucide="chevron-left" class="w-4 h-4 mr-1"></i>
                    Voltar para o Login
                </a>
            </div>
        </form>
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.currentTarget;
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            const email = document.getElementById('email').value;

            btn.innerHTML = 'Enviando...';
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const response = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();
                alert(data.message || data.error || 'Solicitação enviada.');

                if (response.ok) {
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error('Erro ao solicitar recuperação de senha:', error);
                alert('Não foi possível enviar a solicitação.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>

</body>
</html>
