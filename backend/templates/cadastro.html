<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE-2026 | Cadastro de Aluno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --ifrs-green: #32a041;
            --ifrs-red: #e41f1a;
        }
        .bg-ifrs-green { background-color: var(--ifrs-green); }
        .text-ifrs-green { color: var(--ifrs-green); }
        .border-ifrs-green { border-color: var(--ifrs-green); }
        .focus-ifrs-green:focus { border-color: var(--ifrs-green); ring-color: var(--ifrs-green); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans py-12 px-4">

    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md border-t-8 border-ifrs-green">
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4"></div>
            <h1 class="text-2xl font-bold text-gray-800">Sistema de Gestão de Estágios</h1>
            <br>
            <p class="text-gray-500 text-sm">Cadastrar-se</p>
        </div>

        <form id="registerForm" action="/register" method="POST" class="space-y-6">
            <div>
                <label for="matricula" class="block text-sm font-medium text-gray-700">Matrícula</label>
                <input type="text" id="matricula" name="matricula" required maxlength="10"
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400
                    focus:outline-none focus:border-ifrs-green focus:ring-1 focus:ring-ifrs-green"
                    placeholder="Ex: 2024123456">
            </div>

            <div>
                <label for="nome" class="block text-sm font-medium text-gray-700">Nome Completo</label>
                <input type="text" id="nome" name="nome" required
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400
                    focus:outline-none focus:border-ifrs-green focus:ring-1 focus:ring-ifrs-green"
                    placeholder="Seu nome completo">
            </div>

            <div>
                <label for="cpf" class="block text-sm font-medium text-gray-700">CPF</label>
                <input type="text" id="cpf" name="cpf" required maxlength="14"
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400
                    focus:outline-none focus:border-ifrs-green focus:ring-1 focus:ring-ifrs-green"
                    placeholder="000.000.000-00">
            </div>

            <div>
                <label for="telefone" class="block text-sm font-medium text-gray-700">Telefone</label>
                <input type="tel" id="telefone" name="telefone" required maxlength="15"
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400
                    focus:outline-none focus:border-ifrs-green focus:ring-1 focus:ring-ifrs-green"
                    placeholder="(00) 90000-0000">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">E-mail</label>
                <input type="email" id="email" name="email" required
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400
                    focus:outline-none focus:border-ifrs-green focus:ring-1 focus:ring-ifrs-green"
                    placeholder="seu.email@aluno.ifrs.edu.br">
            </div>

            <div>
                <label for="data_nasc" class="block text-sm font-medium text-gray-700">Data de Nascimento</label>
                <input type="date" id="data_nasc" name="data_nasc" required
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400
                    focus:outline-none focus:border-ifrs-green focus:ring-1 focus:ring-ifrs-green"
                    onblur="validarIdade()">
                <span id="erro-idade" class="text-xs text-red-600 mt-1 hidden">Inscrição permitida apenas para candidatos com 14 anos ou mais.</span>
            </div>

            <div>
                <label for="id_curso" class="block text-sm font-medium text-gray-700">Curso</label>
                <select id="id_curso" name="id_curso" required
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-sm
                    focus:outline-none focus:border-ifrs-green focus:ring-1 focus:ring-ifrs-green">
                    <option value="" disabled selected>Selecione seu curso</option>
                </select>
            </div>

            <div>
                <label for="senha" class="block text-sm font-medium text-gray-700">Senha</label>
                <input type="password" id="senha" name="senha" required
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400
                    focus:outline-none focus:border-ifrs-green focus:ring-1 focus:ring-ifrs-green"
                    placeholder="••••••••">
            </div>

            <div>
                <label for="confirmar_senha" class="block text-sm font-medium text-gray-700">Confirmar Senha</label>
                <input type="password" id="confirmar_senha" name="confirmar_senha" required
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400
                    focus:outline-none focus:border-ifrs-green focus:ring-1 focus:ring-ifrs-green"
                    placeholder="••••••••">
            </div>

            <div>
                <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-ifrs-green hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-ifrs-green transition-colors duration-200">
                    CADASTRAR
                </button>
            </div>

            <div class="text-center text-sm">
                <span class="text-gray-600">Já tem uma conta?</span>
                <a href="login.html" class="font-medium text-ifrs-green hover:underline ml-1">
                    Faça login
                </a>
            </div>
        </form>
    </div>

</body>
<script>
    const matriculaInput = document.getElementById('matricula');
    const cpfInput = document.getElementById('cpf');
    const telefoneInput = document.getElementById('telefone');
    const dataNascInput = document.getElementById('data_nasc');
    const erroIdade = document.getElementById('erro-idade');

    function validarIdade() {
        const dataNascimento = new Date(dataNascInput.value);
        if (isNaN(dataNascimento.getTime())) return false;

        const hoje = new Date();
        let idade = hoje.getFullYear() - dataNascimento.getFullYear();
        const m = hoje.getMonth() - dataNascimento.getMonth();

        if (m < 0 || (m === 0 && hoje.getDate() < dataNascimento.getDate())) {
            idade--;
        }

        if (idade < 14) {
            erroIdade.classList.remove('hidden');
            dataNascInput.classList.add('border-red-500');
            return false;
        } else {
            erroIdade.classList.add('hidden');
            dataNascInput.classList.remove('border-red-500');
            return true;
        }
    }

    function validarCPF(cpf) {
        cpf = cpf.replace(/[^\d]+/g, '');
        if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
        let soma = 0, resto;
        for (let i = 1; i <= 9; i++) soma = soma + parseInt(cpf.substring(i - 1, i)) * (11 - i);
        resto = (soma * 10) % 11;
        if (resto === 10 || resto === 11) resto = 0;
        if (resto !== parseInt(cpf.substring(9, 10))) return false;
        soma = 0;
        for (let i = 1; i <= 10; i++) soma = soma + parseInt(cpf.substring(i - 1, i)) * (12 - i);
        resto = (soma * 10) % 11;
        if (resto === 10 || resto === 11) resto = 0;
        return resto === parseInt(cpf.substring(10, 11));
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const cursoSelect = document.getElementById('id_curso');
        try {
            const response = await fetch('http://localhost:3000/cursos');
            const cursos = await response.json();
            cursos.forEach(curso => {
                const option = document.createElement('option');
                option.value = curso.id;
                option.textContent = curso.nome;
                cursoSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Erro ao carregar cursos:', error);
        }
    });

    matriculaInput.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, "");
    });

    cpfInput.addEventListener('input', (e) => {
        let v = e.target.value.replace(/\D/g, "");
        if (v.length > 11) v = v.slice(0, 11);
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        e.target.value = v;
    });

    telefoneInput.addEventListener('input', (e) => {
        let v = e.target.value.replace(/\D/g, "");
        if (v.length > 11) v = v.slice(0, 11);
        v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
        v = v.replace(/(\d{5})(\d)/, "$1-$2");
        e.target.value = v;
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const matricula = document.getElementById('matricula').value;
        const nome = document.getElementById('nome').value;
        const cpf = document.getElementById('cpf').value;
        const telefone = document.getElementById('telefone').value;
        const email = document.getElementById('email').value;
        const data_nasc = document.getElementById('data_nasc').value;
        const id_curso = document.getElementById('id_curso').value;
        const senha = document.getElementById('senha').value;
        const confirmarSenha = document.getElementById('confirmar_senha').value;

        if (!validarIdade()) {
            alert('Candidato não possui a idade mínima de 14 anos para inscrição.');
            return;
        }

        if (!validarCPF(cpf)) {
            alert('O CPF informado é inválido. Por favor, verifique os números.');
            return;
        }

        if (senha !== confirmarSenha) {
            alert('As senhas não coincidem. Por favor, verifique.');
            return;
        }

        const dadosCadastro = {
            matricula,
            nome,
            cpf,
            telefone,
            email,
            id_curso,
            data_nasc,
            senha
        };

        try {

</script>
</html>
