<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE-2026 | Cadastrar Orientador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --ifrs-green: #32a041;
            --ifrs-green-dark: #267a32;
        }
        .bg-ifrs-green { background-color: var(--ifrs-green); }
        .text-ifrs-green { color: var(--ifrs-green); }
        .hover-bg-ifrs-green:hover { background-color: var(--ifrs-green-dark); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <!-- Header Superior -->
    <header class="bg-ifrs-green text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="home.html" class="bg-white p-2 rounded-lg hover:scale-105 transition-transform">
                    <i data-lucide="graduation-cap" class="text-ifrs-green w-8 h-8"></i>
                </a>
                <div>
                    <h1 class="text-xl font-bold leading-tight tracking-tight">SGE-2026</h1>
                    <p class="text-xs font-light opacity-90">Gestão de Estágios IFRS</p>
                </div>
            </div>
            <div class="flex items-center">
                <a href="addEstagio.html" class="flex items-center space-x-2 bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl transition-colors font-bold text-sm">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>VOLTAR</span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-6 py-10">
        <div class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
            <div class="bg-ifrs-green p-8 text-white">
                <h2 class="text-2xl font-black flex items-center space-x-3">
                    <i data-lucide="user-plus" class="w-8 h-8"></i>
                    <span>NOVO ORIENTADOR</span>
                </h2>
                <p class="text-green-50 opacity-80 mt-2">Cadastre um novo professor orientador do IFRS.</p>
            </div>

            <form action="/orientadores" method="POST" class="p-8 space-y-6">
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Nome Completo</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                            <input type="text" name="nome" placeholder="Ex: Prof. Ricardo Rocha" required 
                                class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">E-mail Institucional</label>
                            <div class="relative">
                                <i data-lucide="mail" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                                <input type="email" name="email" placeholder="nome@instituicao.com" required 
                                    class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Telefone/Ramal</label>
                            <div class="relative">
                                <i data-lucide="phone" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                                <input type="text" name="telefone" id="telefone" placeholder="(00) 0000-0000" required maxlength="15"
                                    class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-ifrs-green outline-none transition-all">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pt-6 flex justify-end space-x-4 border-t border-gray-50">
                    <a href="addEstagio.html" class="px-8 py-4 text-gray-400 font-bold hover:text-gray-600 transition-colors uppercase tracking-widest text-xs flex items-center">
                        Cancelar
                    </a>
                    <button type="submit" class="bg-ifrs-green hover:bg-ifrs-green-dark text-white px-10 py-4 rounded-2xl font-bold shadow-lg shadow-green-100 transition-all transform hover:-translate-y-1 active:scale-95 flex items-center space-x-2">
                        <i data-lucide="save" class="w-5 h-5"></i>
                        <span>SALVAR ORIENTADOR</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // Seleção do elemento para aplicação de máscara de telefone
        const telefoneInput = document.getElementById('telefone');

        // Máscara de Telefone ((00) 00000-0000)
        if (telefoneInput) {
            telefoneInput.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, "");
                if (v.length > 11) v = v.slice(0, 11);
                v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
                v = v.replace(/(\d{5})(\d)/, "$1-$2");
                e.target.value = v;
            });
        }

        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (telefoneInput) {
                telefoneInput.value = telefoneInput.value.replace(/[^\d]+/g, '');
            }

            const form = e.currentTarget;
            const payload = Object.fromEntries(new FormData(form).entries());

            try {
                const response = await fetch('/orientadores', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Orientador cadastrado com sucesso!');
                    window.location.href = 'addEstagio.html';
                    return;
                }

                alert(data.error || 'Erro ao salvar orientador.');
            } catch (error) {
                console.error('Erro ao salvar orientador:', error);
                alert('Falha na comunicação com o servidor.');
            }
        });
    </script>
</body>
</html>
