<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Empresas - SGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="bg-gray-100 flex h-screen font-sans">
    <!-- Reutilizando Sidebar via layout comum (exemplo conceitual) -->
    <aside class="w-64 bg-green-800 text-white flex flex-col">
        <div class="p-6 text-2xl font-bold border-b border-green-700">IFRS - SGE</div>
        <nav class="flex-grow p-4 space-y-2">
            <a href="index.html" class="block p-3 hover:bg-green-700 rounded-lg"><i class="fas fa-chart-line mr-2"></i>
                Dashboard</a>
            <a href="empresas.html" class="block p-3 bg-green-700 rounded-lg shadow-sm"><i
                    class="fas fa-building mr-2"></i> Empresas</a>
        </nav>
    </aside>

    <main class="flex-grow overflow-y-auto">
        <header class="bg-white shadow-sm p-4 px-8 flex justify-between items-center">
            <h1 class="text-xl font-semibold text-gray-700">Gerenciar Empresas</h1>
            <button onclick="toggleModal()"
                class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium transition">
                <i class="fas fa-plus mr-2"></i> Nova Empresa
            </button>
        </header>

        <div class="p-8">
            <div class="bg-white rounded-xl shadow-md overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="p-4 font-semibold text-gray-600">Razão Social</th>
                            <th class="p-4 font-semibold text-gray-600">CNPJ</th>
                            <th class="p-4 font-semibold text-gray-600">E-mail</th>
                            <th class="p-4 font-semibold text-gray-600">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-empresas" class="divide-y divide-gray-100 text-gray-700">
                        <!-- Dinâmico -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Cadastro -->
    <div id="modal-empresa" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center">
                <h2 class="text-xl font-bold">Cadastrar Nova Empresa</h2>
                <button onclick="toggleModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            <form id="form-empresa" class="p-6 grid grid-cols-2 gap-4 text-sm text-gray-600">
                <div class="col-span-2">
                    <label class="block mb-1 font-medium">Razão Social *</label>
                    <input type="text" name="nome_social"
                        class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-green-500 outline-none" required>
                </div>
                <div>
                    <label class="block mb-1 font-medium">CNPJ (14 dígitos) *</label>
                    <input type="text" name="CNPJ_NibocoProd" maxlength="14"
                        class="w-full border rounded-lg p-2 outline-none" required>
                </div>
                <div>
                    <label class="block mb-1 font-medium">E-mail de Contato</label>
                    <input type="email" name="email" class="w-full border rounded-lg p-2 outline-none">
                </div>
                <div class="col-span-2">
                    <label class="block mb-1 font-medium">Endereço</label>
                    <input type="text" name="endereco" class="w-full border rounded-lg p-2 outline-none">
                </div>
                <div class="col-span-2 flex justify-end space-x-3 mt-4">
                    <button type="button" onclick="toggleModal()"
                        class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
                    <button type="submit"
                        class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-bold shadow-md">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function toggleModal() {
            const modal = document.getElementById('modal-empresa');
            modal.classList.toggle('hidden');
        }

        window.onload = () => {
            carregarEmpresas();
        };
    </script>
</body>

</html>
